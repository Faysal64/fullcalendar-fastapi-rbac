services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      JWT_SECRET: "change-me"
      JWT_ALG: "HS256"
      ACCESS_TOKEN_EXPIRE_MIN: "120"
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app

    # ✅ hardening (ajouté, ne touche pas à la DB)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pgdata:
